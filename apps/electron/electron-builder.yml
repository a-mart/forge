appId: com.forge.desktop
productName: Forge
icon: build/icon
directories:
  output: release
  buildResources: build
afterPack: scripts/electron-builder-after-pack.cjs
afterSign: scripts/electron-builder-after-sign.cjs
files:
  - dist/**/*
  - '!dist/browser-fixture-smoke-main*'
  - '!dist/browser-popout-reparent-smoke-main*'
  - '!dist/managed-browser-popout-fixture-main*'
  - node_modules/playwright-core/**/*
  - package.json
extraResources:
  - from: .stage/backend/dist
    to: backend/dist
    filter:
      - '**/*'
  - from: .stage/backend/static
    to: backend/static
    filter:
      - '**/*'
  - from: .stage/backend/package.json
    to: backend/package.json
  - from: .stage/backend/node_modules
    to: backend/node_modules
    filter:
      - '**/*'
      - '.pnpm/**/*'
  - from: .stage/ui
    to: ui
    filter:
      - '**/*'
  - from: .stage/forge-resources
    to: forge-resources
    filter:
      - '**/*'
  - from: .stage/cli
    to: cli
    filter:
      - '**/*'
  - from: .stage/browser-runtime
    to: browser-runtime
    filter:
      - '**/*'
  - from: .stage/external-chrome
    to: external-chrome
    filter:
      - '**/*'
  - from: .stage/stream-deck
    to: stream-deck
    filter:
      - '**/*'
protocols:
  - name: Forge Skill Import
    schemes:
      - forge
publish:
  - provider: github
    owner: a-mart
    repo: forge
mac:
  target:
    - target: dmg
    - target: zip
  category: public.app-category.developer-tools
  identity: ''
  # The native host is pre-signed and hashed before staging. Re-signing it would
  # invalidate package-manifest.json; afterSign verifies it stayed byte-identical.
  signIgnore:
    - '/Contents/Resources/external-chrome/native-host/'
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  notarize: true
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: true
  perMachine: false
  artifactName: "Forge-Setup-${version}.${ext}"
# Forge Desktop releases are macOS and Windows only. Keep a non-publishable
# directory target for local packaging smoke work; do not add Linux release artifacts here.
linux:
  target:
    - target: dir
