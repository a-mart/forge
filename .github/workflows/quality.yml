name: Manual Quality Gate

on:
  workflow_dispatch:
    inputs:
      tier:
        description: Local quality tier to run
        required: true
        default: full
        type: choice
        options:
          - quick
          - changed
          - full
      base:
        description: Optional base ref for changed-file routing
        required: false
        type: string

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Provision frozen Pi 0.71.1 rollback runner
        if: ${{ inputs.tier == 'full' || inputs.tier == 'changed' }}
        run: ./scripts/pi-upgrade/provision-pi-0711-rollback-runner.sh

      - name: Run local quality
        env:
          QUALITY_TIER: ${{ inputs.tier }}
          QUALITY_BASE: ${{ inputs.base }}
        run: |
          args=("--json")
          if [ -n "$QUALITY_BASE" ]; then
            args+=("--base" "$QUALITY_BASE")
          fi
          pnpm "quality:$QUALITY_TIER" -- "${args[@]}"

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-quality-report
          path: .forge/quality/latest.json
          if-no-files-found: ignore

  windows-pi-trust-gates:
    name: Windows Pi trust gates
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run mandatory Windows junction/case trust gates
        shell: bash
        env:
          FORGE_REQUIRE_WIN32_TRUST_GATES: "1"
        run: |
          cd apps/backend
          pnpm exec vitest run \
            src/swarm/__tests__/pi-denied-trust-loader-characterization.test.ts \
            src/swarm/__tests__/project-executable-trust.test.ts
